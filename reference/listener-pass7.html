<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listener Soft Instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Hanken+Grotesk:wght@200..500&display=swap">
<style>
@property --cast{syntax:'<color>';inherits:true;initial-value:#6f8fc9}
/* Flat White by day, Mocha by night (2050 Calmppuccin) */
:root{
  --base:#fbfaf8;--surface:#ffffff;--text:#3f3f48;--text-muted:#62626b;--line:#d8d5d0;--hair:rgba(0,0,0,.07);
  --accent:var(--acc-l,#355aa0);--desk-a:#d6dde6;--desk-b:#e9e1d8;--desk-c:#c9d3d2;--shadow:rgba(40,40,60,.16);
  --cast-pct:30%;--glow:880px;--mat:82%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --base:#1b1b29;--surface:#20202f;--text:#dfe4f0;--text-muted:#8a90a6;--line:#2a2a3d;--hair:rgba(255,255,255,.06);
  --accent:var(--acc-d,#7fa6e6);--desk-a:#232a3b;--desk-b:#2e2733;--desk-c:#1d2a2e;--shadow:rgba(0,0,0,.45);
  --cast-pct:34%;--glow:1000px;--mat:84%;color-scheme:dark}}
:root[data-theme="dark"]{
  --base:#1b1b29;--surface:#20202f;--text:#dfe4f0;--text-muted:#8a90a6;--line:#2a2a3d;--hair:rgba(255,255,255,.06);
  --accent:var(--acc-d,#7fa6e6);--desk-a:#232a3b;--desk-b:#2e2733;--desk-c:#1d2a2e;--shadow:rgba(0,0,0,.45);
  --cast-pct:34%;--glow:1000px;--mat:84%;color-scheme:dark}
:root[data-look="day"]{
  --base:#fbfaf8;--surface:#ffffff;--text:#3f3f48;--text-muted:#62626b;--line:#d8d5d0;--hair:rgba(0,0,0,.07);
  --accent:var(--acc-l,#355aa0);--desk-a:#d6dde6;--desk-b:#e9e1d8;--desk-c:#c9d3d2;--shadow:rgba(40,40,60,.16);
  --cast-pct:30%;--glow:880px;--mat:82%;color-scheme:light}
:root[data-look="night"]{
  --base:#1b1b29;--surface:#20202f;--text:#dfe4f0;--text-muted:#8a90a6;--line:#2a2a3d;--hair:rgba(255,255,255,.06);
  --accent:var(--acc-d,#7fa6e6);--desk-a:#232a3b;--desk-b:#2e2733;--desk-c:#1d2a2e;--shadow:rgba(0,0,0,.45);
  --cast-pct:34%;--glow:1000px;--mat:84%;color-scheme:dark}
:root{
  --text-dim:var(--text-muted);
  --text-dim:color-mix(in srgb,var(--text-muted) 72%,var(--base));
  --text-faint:var(--line);
  --text-faint:color-mix(in srgb,var(--text-muted) 44%,var(--base));
  --cast:#6f8fc9;
  --ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Fragment Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
html,body{min-height:100%}
body{background:var(--base);color:var(--text);font:400 14px/1.5 var(--ui);letter-spacing:.01em;-webkit-font-smoothing:antialiased;padding-inline:16px;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}
.num{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12.5px;color:var(--text-dim)}

/* prototype controls, outside the app */
.proto{max-width:1180px;margin:0 auto;padding-block:16px 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.proto .grp{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.proto span,.proto button,.proto label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);cursor:pointer}
.proto .me{color:var(--text);cursor:default}
.proto button[aria-pressed="true"]{color:var(--text)}
.proto input{position:absolute;opacity:0;width:1px;height:1px}

/* the desktop */
.desk-wrap{max-width:1180px;margin:0 auto;padding-bottom:40px}
.desk{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(155deg,var(--desk-a),var(--desk-b) 55%,var(--desk-c))}
.desk-inner{position:absolute;left:0;top:0;width:1180px;height:780px;transform-origin:0 0}
[data-hidden="true"]{opacity:0;pointer-events:none;visibility:hidden}

/* main window: no title bar, the traffic lights sit in the content */
.win{position:absolute;left:50px;top:40px;width:1080px;height:700px;border-radius:12px;overflow:hidden;background:var(--base);
  box-shadow:0 30px 80px -20px var(--shadow),0 0 0 .5px var(--hair);transition:--cast .7s var(--ease)}
.win::before,.mini::before{content:"";position:absolute;inset:0;pointer-events:none;transition:opacity .4s var(--ease),--cast .7s var(--ease)}
.win::before{background:radial-gradient(var(--glow) calc(var(--glow)*.8) at var(--lx,116px) var(--ly,132px),color-mix(in srgb,var(--cast) var(--cast-pct),transparent),transparent 62%)}
:root[data-light="flat"] .win::before,:root[data-light="flat"] .mini::before{opacity:0}
.lights{position:absolute;left:18px;top:18px;display:flex;gap:8px;z-index:2}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.win:hover .lights i:nth-child(1){background:#ec6a5e}.win:hover .lights i:nth-child(2){background:#f4bf4f}.win:hover .lights i:nth-child(3){background:#61c554}
.panes{position:relative;display:grid;grid-template-columns:1fr 400px;height:100%}

/* listening: instrument first */
.listen{position:relative;padding:64px 48px 44px;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.stage{position:relative;display:grid;align-items:center}
.stage canvas{display:block;width:100%;height:280px;cursor:pointer;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
.stage[data-mode="orbit"] canvas{-webkit-mask-image:none;mask-image:none}
.stage[data-mode="orbit"] canvas{height:340px}
.tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-top:6px}
.tp .ctl{display:flex;align-items:center;gap:30px}
.tp .num:last-child{justify-self:end}
.ico{color:var(--text-dim);display:grid;place-items:center;width:28px;height:28px;transition:color .14s ease}
.ico:hover{color:var(--text)}
.play{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);color:var(--text);transition:box-shadow .14s ease}
.play:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.now{display:grid;grid-template-columns:136px minmax(0,1fr);gap:24px;align-items:center;min-width:0}
.now .cover{border-radius:9px}
.cover{display:block;aspect-ratio:1;width:100%;border-radius:7px;overflow:hidden}
.cover svg{display:block;width:100%;height:100%}
.title{max-width:22ch;font-weight:250;font-size:28px;line-height:1.18;letter-spacing:-.012em;margin:0 0 4px;text-wrap:balance}
.opts{position:absolute;top:16px;right:32px;display:flex;gap:16px;align-items:baseline;z-index:2}
.opts button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);transition:color .14s ease}
.opts button[aria-pressed="true"]{color:var(--text)}
.opts button:hover{color:var(--text-dim)}
.opts .spd{margin-left:10px;text-transform:none;letter-spacing:.04em}

/* library */
.lib{border-left:1px solid var(--hair);padding:12px 22px 20px 32px;display:grid;grid-template-rows:36px 1fr;min-height:0}
.lib-h{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:20px;align-items:baseline}
.tabs button{font-size:14.5px;color:var(--text-faint);transition:color .14s ease}
.tabs button[aria-pressed="true"]{color:var(--text)}
.modes{display:flex;gap:2px}
.modes button{width:28px;height:24px;display:grid;place-items:center;color:var(--text-faint);border-radius:6px;transition:color .14s ease}
.modes button:hover{color:var(--text)}
.modes button[aria-pressed="true"]{color:var(--text-dim)}
.list{overflow:auto;scrollbar-width:none;min-height:0;padding:14px 10px 0 0}
.list::-webkit-scrollbar{display:none}
.day{font-size:12px;color:var(--text-faint);margin:22px 0 2px}
.day:first-child{margin-top:4px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;padding:9px 0}
.row .cover{border-radius:6px}
.row .t{display:block;font-size:14.5px;line-height:1.35;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .14s ease}
.row .m{display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row:hover .t{color:var(--accent)}
.row.heard .t,.row.heard .m{opacity:.5}
.row.playing .t{color:var(--accent)}
.row.show{grid-template-columns:40px minmax(0,1fr);padding:10px 0}
.row.plain{grid-template-columns:minmax(0,1fr)}
.back{font-size:12.5px;color:var(--text-dim);margin:4px 0 18px}
.back:hover{color:var(--text)}
.show-h{font-weight:250;font-size:24px;line-height:1.2;margin:0 0 8px}
.show-p{color:var(--text-dim);font-size:13.5px;margin:0 0 14px;max-width:38ch}
.new{color:var(--accent)}
.set h2{font-weight:250;font-size:24px;line-height:1.2;margin:4px 0 26px}
.set section{padding:0 0 22px;margin:0 0 22px;border-bottom:1px solid var(--hair)}
.set section:last-child{border-bottom:0}
.set .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--text-faint);margin-bottom:12px}
.set .lbl b{font-weight:400;color:var(--text-dim)}
.sw{display:grid;grid-template-columns:repeat(7,22px);gap:14px 18px}
.sw button{width:22px;height:22px;border-radius:50%;background:var(--c);position:relative;transition:transform .14s var(--ease)}
.sw button:hover{transform:scale(1.12)}
.sw button[aria-pressed="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 1px var(--c)}
.words{display:flex;gap:18px;flex-wrap:wrap}
.words button{font-size:14px;color:var(--text-faint);transition:color .14s ease}
.words button:hover{color:var(--text-dim)}
.words button[aria-pressed="true"]{color:var(--text)}
.imp{display:grid;gap:10px}
.imp label{font-size:14px;color:var(--text);cursor:pointer;display:grid;gap:1px}
.imp label:hover span:first-child{color:var(--accent)}
.imp input{position:absolute;opacity:0;width:1px;height:1px}
.done{font-size:13px;color:var(--text-dim);margin:12px 0 0;max-width:40ch}

/* floating windows take the desktop's material */
.material{background:var(--surface);background:color-mix(in srgb,var(--surface) var(--mat),transparent);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 20px 50px -18px var(--shadow),0 0 0 .5px var(--hair)}
.mini{position:absolute;right:80px;top:64px;width:280px;border-radius:18px;padding:14px 20px 18px;overflow:hidden;transition:--cast .7s var(--ease)}
.mini::before{background:radial-gradient(240px 220px at 50% 128px,color-mix(in srgb,var(--cast) var(--cast-pct),transparent),transparent 70%)}
.mini .head{position:absolute;top:10px;right:10px;display:flex;gap:0;z-index:2;opacity:0;transition:opacity .2s var(--ease)}
.mini:hover .head,.mini:focus-within .head{opacity:1}
.orb{position:relative;width:240px;height:240px;margin:0 auto}
.orb canvas{width:240px;height:240px;display:block}
.disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden}
.disc svg{width:100%;height:100%;display:block}
.orb .disc{width:72px;height:72px}
.mini .t{position:relative;text-align:center;font-weight:300;font-size:16.5px;line-height:1.3;margin:2px 0 2px;text-wrap:balance}
.mini .s{position:relative;text-align:center;margin:0}
.mini .tp{position:relative;margin-top:14px;gap:10px}
.mini .tp .ctl{gap:18px}
.mini .play{width:42px;height:42px}

.pillw{position:absolute;left:50%;bottom:44px;width:340px;margin-left:-170px}
.pill{display:flex;align-items:center;gap:10px;height:48px;border-radius:999px;padding:0 8px 0 2px}
.po{position:relative;width:46px;height:46px;flex:none}
.po canvas{width:46px;height:46px;display:block}
.po .disc{width:13px;height:13px}
.pill .who{flex:1;min-width:0;display:grid;line-height:1.25;text-align:left}
.pill .who .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .pp{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--text)}
.pill .pp:hover{background:var(--hair)}
.panel{position:absolute;left:0;right:0;bottom:58px;border-radius:18px;padding:18px 20px;display:grid;gap:12px;transform-origin:bottom center;
  transition:opacity .2s var(--ease),transform .2s var(--ease)}
.panel[data-open="false"]{opacity:0;transform:translateY(8px) scale(.98);pointer-events:none}
.panel .top{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.panel .t{font-size:14.5px;line-height:1.3}
.panel canvas{width:100%;height:34px;display:block}
.panel .ctl{display:flex;align-items:center;justify-content:center;gap:24px}
.panel .play{width:40px;height:40px}

.fly{position:fixed;z-index:50;overflow:hidden;pointer-events:none;transform-origin:0 0;will-change:transform,border-radius}
.fly svg{display:block;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style></head><body>

<div class="proto" aria-label="Prototype controls">
  <div class="grp"><span class="me">Listener</span><span style="cursor:default">Pass 7</span></div>
  <div class="grp">
    <label for="fileIn">Play a file of yours</label><input type="file" id="fileIn" accept="audio/*">
  </div>
</div>

<div class="desk-wrap">
  <div class="desk" id="desk">
    <div class="desk-inner" id="deskInner">

      <section class="win" id="win" aria-label="Listener window">
        <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <div class="panes">
          <div class="listen">
              <div class="opts">
                <span role="group" aria-label="Visualization" style="display:flex;gap:14px"><button data-vz="field" aria-pressed="true">Field</button><button data-vz="thread" aria-pressed="false">Thread</button><button data-vz="orbit" aria-pressed="false">Orbit</button></span>
                <button class="spd num" data-act="speed" id="spd" aria-label="Playback speed">1.4×</button>
              </div>
            <div class="bottom">
              <div class="now">
                <span class="cover" id="nowCover"></span>
                <div style="min-width:0"><h1 class="title" id="nowTitle"></h1><span class="sub" id="nowShow"></span></div>
              </div>
            </div>
            <div class="stage" id="stage" data-mode="field"><canvas id="cMain" aria-label="Waveform. Click to move through the episode."></canvas></div>
            <div class="tp">
              <span class="num" id="tNow"></span>
              <span class="ctl">
                <button class="ico" data-act="back" aria-label="Back 15 seconds"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M4.6 8.4A6 6 0 1 1 4 12"/><path d="M4 4.6v3.9h3.9"/></svg></button>
                <button class="play" data-act="toggle" id="playMain" aria-label="Play"></button>
                <button class="ico" data-act="fwd" aria-label="Forward 30 seconds"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M15.4 8.4A6 6 0 1 0 16 12"/><path d="M16 4.6v3.9h-3.9"/></svg></button>
              </span>
              <span class="num" id="tLeft"></span>
            </div>
          </div>
          <div class="lib">
            <div class="lib-h">
              <span class="tabs" role="group" aria-label="Library"><button data-tab="new" aria-pressed="true">New</button><button data-tab="following" aria-pressed="false">Following</button></span>
              <span class="modes" role="group" aria-label="Window size">
                <button data-tab="settings" aria-label="Settings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
                <button data-mode="mini" aria-label="Mini player"><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="11" height="13" rx="3"/><circle cx="6" cy="5.5" r="2.5"/></svg></button>
                <button data-mode="pill" aria-label="Pill"><svg width="18" height="8" viewBox="0 0 18 8" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="17" height="7" rx="3.5"/><circle cx="4" cy="4" r="1.5"/></svg></button>
              </span>
            </div>
            <div class="list" id="list"></div>
          </div>
        </div>
      </section>

      <section class="mini material" id="mini" data-hidden="true" aria-label="Mini player">
        <div class="head">
          <button class="ico" data-mode="win" aria-label="Open the full window"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M8.5 1.5h4v4M12.5 1.5L8 6M5.5 12.5h-4v-4M1.5 12.5L6 8"/></svg></button>
          <button class="ico" data-mode="pill" aria-label="Fold into the pill"><svg width="16" height="8" viewBox="0 0 18 8" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="17" height="7" rx="3.5"/></svg></button>
        </div>
        <div class="orb"><canvas id="cMini" aria-label="Orbit. Click to move through the episode."></canvas><span class="disc" id="miniDisc"></span></div>
        <p class="t" id="miniTitle"></p>
        <p class="s sub" id="miniShow"></p>
        <div class="tp">
          <span class="num" id="mNow"></span>
          <span class="ctl">
            <button class="ico" data-act="back" aria-label="Back 15 seconds"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M4.6 8.4A6 6 0 1 1 4 12"/><path d="M4 4.6v3.9h3.9"/></svg></button>
            <button class="play" data-act="toggle" id="playMini" aria-label="Play"></button>
            <button class="ico" data-act="fwd" aria-label="Forward 30 seconds"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M15.4 8.4A6 6 0 1 0 16 12"/><path d="M16 4.6v3.9h-3.9"/></svg></button>
          </span>
          <span class="num" id="mLeft"></span>
        </div>
      </section>

      <section class="pillw" id="pillw" data-hidden="true" aria-label="Pill player">
        <div class="panel material" id="panel" data-open="false">
          <div class="top"><span class="cover" id="panCover"></span><div style="min-width:0"><div class="t" id="panTitle"></div><span class="sub" id="panShow"></span></div></div>
          <canvas id="cPanel"></canvas>
          <div class="ctl">
            <button class="ico" data-mode="win" aria-label="Open the full window"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor"><path d="M8.5 1.5h4v4M12.5 1.5L8 6M5.5 12.5h-4v-4M1.5 12.5L6 8"/></svg></button>
            <button class="ico" data-act="back" aria-label="Back 15 seconds"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M4.6 8.4A6 6 0 1 1 4 12"/><path d="M4 4.6v3.9h3.9"/></svg></button>
            <button class="play" data-act="toggle" id="playPanel" aria-label="Play"></button>
            <button class="ico" data-act="fwd" aria-label="Forward 30 seconds"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M15.4 8.4A6 6 0 1 0 16 12"/><path d="M16 4.6v3.9h-3.9"/></svg></button>
            <button class="ico" data-mode="mini" aria-label="Open the mini player"><svg width="12" height="14" viewBox="0 0 12 14" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="11" height="13" rx="3"/><circle cx="6" cy="5.5" r="2.5"/></svg></button>
          </div>
        </div>
        <div class="pill material">
          <span class="po"><canvas id="cPill" aria-hidden="true"></canvas><span class="disc" id="pillDisc"></span></span>
          <button class="who" data-act="panel" aria-label="Open the pill panel"><span class="t" id="pillTitle"></span><span class="num" id="pillTime"></span></button>
          <button class="pp" data-act="toggle" id="playPill" aria-label="Play"></button>
        </div>
      </section>

    </div>
  </div>
</div>
<audio id="audio" preload="auto"></audio>

<script>
(() => {
const $ = s => document.querySelector(s);
const root = document.documentElement;

  if (st.mode === 'win'){ const [c,w,h] = fit(V.main.canvas);

    else if (st.vz === 'thread') drawThread(V.main, c, w, h, h/2, prog, pk, active, el);
    else drawOrbit(V.main, c, w, h, prog, pk, active, el); }
  if (st.mode === 'mini'){ const [c,w,h] = fit(V.mini.canvas); drawOrbit(V.mini, c, w, h, prog, pk, active, el, { inner:.165, maxRay:.32, rays:84 }); }
  if (st.mode === 'pill'){ const [c,w,h] = fit(V.pill.canvas); drawOrbit(V.pill, c, w, h, prog, pk, active, el, { small:true, inner:.2, maxRay:.28, rays:30 });
    if (st.panel){ const [c2,w2,h2] = fit(V.panel.canvas); drawTether(V.panel, c2, w2, h2, h2/2, prog, active); } }
}

/* ---------- text ---------- */
const leftStr = ep => `${Math.max(1, Math.round((ep.dur-ep.pos)/60))} min left`;
function renderNow(){
  const s = S[st.si], ep = cur(), art = coverOf(s);
  root.style.setProperty('--cast', s.cast);
  ['#nowCover','#miniDisc','#panCover','#pillDisc'].forEach(id => $(id).innerHTML = art);
  $('#nowTitle').textContent = ep.title; $('#nowShow').textContent = s.name;
  $('#miniTitle').textContent = ep.title; $('#miniShow').textContent = s.short;
  $('#panTitle').textContent = ep.title; $('#panShow').textContent = s.short;
  $('#pillTitle').textContent = ep.title;
  ['#playMain','#playMini','#playPanel','#playPill'].forEach(id => { const b = $(id); b.innerHTML = st.playing ? PAUSE : PLAY; b.setAttribute('aria-label', st.playing ? 'Pause' : 'Play'); });
  $('#spd').textContent = `${st.speed.toFixed(1)}×`;
  renderTime(); placeLight();
}
function renderTime(){
  const ep = cur();
  $('#tNow').textContent = fmt(ep.pos); $('#tLeft').textContent = leftStr(ep);
  $('#mNow').textContent = fmt(ep.pos); $('#mLeft').textContent = `−${Math.max(1, Math.round((ep.dur-ep.pos)/60))} min`;
  $('#pillTime').textContent = `${fmt(ep.pos)} · ${leftStr(ep)}`;
}
const len = e => e.pos > 0 && e.pos < e.dur ? leftStr(e) : `${Math.round(e.dur/60)} min`;
function renderList(){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === st.tab));
  const L = $('#list'), playing = e => e.si === st.si && e.ei === st.ei;
  const row = (e, withCover, meta) => `<button class="row ${withCover ? '' : 'plain'} ${e.pos >= e.dur ? 'heard' : ''} ${playing(e) ? 'playing' : ''}" data-play="${e.si}:${e.ei}">
    ${withCover ? `<span class="cover">${coverOf(S[e.si])}</span>` : ''}<span style="min-width:0"><span class="t">${esc(e.title)}</span><span class="m"><span class="sub">${esc(meta)}</span> <span class="num">${len(e)}</span></span></span></button>`;
  document.querySelectorAll('.modes [data-tab]').forEach(b => b.setAttribute('aria-pressed', st.tab === 'settings'));
  if (st.tab === 'settings'){ renderSettings(L); return; }
  if (st.tab === 'new'){
    const all = S.flatMap(s => s.eps).sort((a,b) => dayN(b.d) - dayN(a.d)).slice(0, 10);
    const bucket = e => { const ago = dayN(TODAY) - dayN(e.d); return ago === 0 ? 'Today' : ago <= 7 ? 'This week' : 'Earlier'; };
    let lastB = '', html = '';
    all.forEach(e => { const b = bucket(e); if (b !== lastB){ html += `<div class="day">${b}</div>`; lastB = b; } html += row(e, true, `${S[e.si].short} ·`); });
    L.innerHTML = html;
  } else if (st.open === null){
    L.innerHTML = S.map((s,i) => { const fresh = s.eps.filter(e => dayN(TODAY) - dayN(e.d) <= 7 && e.pos === 0).length;
      return `<button class="row show" data-open="${i}"><span class="cover">${coverOf(s)}</span>
      <span style="min-width:0"><span class="t">${esc(s.name)}</span><span class="m sub">${fresh ? `<span class="new">${fresh} new</span> · ` : ''}${s.freq}</span></span></button>`; }).join('');
  } else {
    const s = S[st.open];
    L.innerHTML = `<button class="back" data-open="back">← Following</button><h2 class="show-h">${esc(s.name)}</h2><p class="show-p">${esc(s.about)}</p>` +
      (s.eps.length ? '' : '<p class="show-p">Episodes arrive on the first refresh.</p>') + s.eps.map(e => row(e, false, `${e.d % 100} ${['','','','','','','','Jul','Aug','Sep'][Math.floor(e.d/100)]} ·`)).join('');
  }
}

/* ---------- settings: accent, appearance, light, and bringing shows in ---------- */
const ACCENTS = [ /* Calmppuccin: [name, Flat White value, Mocha value] */
  ['Rosewater','#a07b74','#e2cfcb'],['Flamingo','#a86a6a','#e9c5c5'],['Pink','#a85590','#e4b5d7'],['Mauve','#734aa0','#ba9ae2'],
  ['Red','#a8354f','#e4829e'],['Maroon','#944650','#d8939f'],['Peach','#a8652e','#e2a37b'],['Yellow','#947a28','#e7d1a2'],
  ['Green','#457747','#99cf94'],['Teal','#387f73','#8cd3c7'],['Sky','#2c739b','#80ccda'],['Sapphire','#256597','#70b7d8'],
  ['Blue','#355aa0','#7fa6e6'],['Lavender','#555ea8','#a6afe9'] ];
let accent = 'Blue', importNote = '';
function setAccent(name){
  const a = ACCENTS.find(x => x[0] === name) || ACCENTS[12]; accent = a[0];
  root.style.setProperty('--acc-l', a[1]); root.style.setProperty('--acc-d', a[2]);
  try { localStorage.setItem('listener.accent', accent); } catch(e) {}
  requestAnimationFrame(() => { resolveColors(); settle = 40; });
}
function renderSettings(L){
  const look = root.dataset.look || '', light = root.dataset.light || 'cast', dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = look ? look === 'night' : (root.dataset.theme ? root.dataset.theme === 'dark' : dark);
  L.innerHTML = `<div class="set"><h2>Settings</h2>
    <section><div class="lbl">Accent <b>${accent}</b></div>
      <div class="sw" role="group" aria-label="Accent colour">${ACCENTS.map(a => `<button data-accent="${a[0]}" aria-label="${a[0]}" aria-pressed="${a[0] === accent}" style="--c:${isDark ? a[2] : a[1]}"></button>`).join('')}</div></section>
    <section><div class="lbl">Appearance</div>
      <div class="words" role="group" aria-label="Appearance"><button data-look="" aria-pressed="${look === ''}">Follow the system</button><button data-look="day" aria-pressed="${look === 'day'}">Day</button><button data-look="night" aria-pressed="${look === 'night'}">Night</button></div></section>
    <section><div class="lbl">Light</div>
      <div class="words" role="group" aria-label="Light"><button data-light="cast" aria-pressed="${light === 'cast'}">Cast from the artwork</button><button data-light="flat" aria-pressed="${light === 'flat'}">Flat</button></div></section>
    <section><div class="lbl">Bring your shows</div>
      <div class="imp">
        <label for="opmlIn"><span>From a list of shows</span><span class="sub">An OPML file, from Overcast, Pocket Casts or most other podcast apps</span></label><input type="file" id="opmlIn" accept=".opml,.xml,text/xml">
        <label for="spotIn"><span>From your Spotify data</span><span class="sub">YourLibrary.json, from Spotify's privacy page</span></label><input type="file" id="spotIn" accept=".json,application/json">
      </div>${importNote ? `<p class="done">${importNote}</p>` : ''}</section></div>`;
  $('#opmlIn').addEventListener('change', e => readImport(e, 'opml'));
  $('#spotIn').addEventListener('change', e => readImport(e, 'spotify'));
}
async function readImport(e, kind){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const text = await f.text(); let found = [];
  try {
    if (kind === 'opml'){
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      found = [...doc.querySelectorAll('outline[xmlUrl], outline[xmlurl]')].map(o => ({ name: o.getAttribute('title') || o.getAttribute('text') || 'Untitled show', feed: o.getAttribute('xmlUrl') || o.getAttribute('xmlurl') }));
    } else {
      const j = JSON.parse(text); found = (j.shows || j.Shows || []).map(x => ({ name: x.name || x.showName || 'Untitled show', publisher: x.publisher || '' }));
    }
  } catch(err){ importNote = 'That file could not be read. An OPML file or YourLibrary.json works here.'; renderList(); return; }
  const have = new Set(S.map(x => x.name.toLowerCase())); let added = 0;
  found.forEach(x => { if (have.has(x.name.toLowerCase())) return; have.add(x.name.toLowerCase()); added++;
    S.push({ id:'imp'+S.length, name:x.name, short:x.name, cast:'#8fa4c9', freq: kind === 'opml' ? 'From your list' : 'From Spotify',
      about: kind === 'opml' ? 'Its feed address came with your list. Episodes arrive on the first refresh.' : `Matched by name${x.publisher ? ' and publisher' : ''} to its public feed. If Spotify is the only home for this show, it stays listed here and plays nowhere else.`, eps:[] }); });
  const skipped = found.length - added;
  importNote = found.length ? `${added} ${added === 1 ? 'show is' : 'shows are'} in Following${skipped ? `, ${skipped} you already had` : ''}.` + (kind === 'spotify' ? ' In the app, each is looked up in the Podcast Index by name and publisher to find its feed.' : '') : 'No shows were in that file.';
  renderList();
}

/* ---------- light comes from the cover ---------- */
let K = 1;
function placeLight(){
  const w = $('#win').getBoundingClientRect(), c = $('#nowCover').getBoundingClientRect();
  if (!w.width) return;
  $('#win').style.setProperty('--lx', `${(c.left + c.width/2 - w.left)/K}px`);
  $('#win').style.setProperty('--ly', `${(c.top + c.height/2 - w.top)/K}px`);
}

/* ---------- window modes, with one continuous motion ---------- */
const EL = { win:'#win', mini:'#mini', pill:'#pillw' };
const ART = { win:'#nowCover', mini:'#miniDisc', pill:'#pillDisc' };
const EASE = 'cubic-bezier(.32,.72,0,1)';
function setMode(to){
  const from = st.mode; if (from === to) return;
  st.mode = to; if (to !== 'pill'){ st.panel = false; $('#panel').dataset.open = false; }
  const outEl = $(EL[from]), inEl = $(EL[to]), srcArt = $(ART[from]), dstArt = $(ART[to]);
  const sR = srcArt.getBoundingClientRect(), oR = outEl.getBoundingClientRect();
  inEl.dataset.hidden = 'false';
  document.querySelectorAll('.modes [data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === to));
  settle = 120;
  if (reduced.matches){ outEl.dataset.hidden = 'true'; drawAll(16); return; }
  const dR = dstArt.getBoundingClientRect(), iR = inEl.getBoundingClientRect();
  /* the old window folds toward the new one */
  const tx = (iR.left + iR.width/2 - (oR.left + oR.width/2))/K, ty = (iR.top + iR.height/2 - (oR.top + oR.height/2))/K;
  const sc = Math.max(.08, Math.min(1, iR.width/oR.width));
  outEl.style.pointerEvents = 'none';
  outEl.animate([{ opacity:1, transform:'none' }, { opacity:0, transform:`translate(${tx}px,${ty}px) scale(${sc})` }], { duration:340, easing:EASE })
    .onfinish = () => { outEl.dataset.hidden = 'true'; outEl.style.pointerEvents = ''; };
  inEl.animate([{ opacity:0, transform:`translate(${-tx*.25}px,${-ty*.25}px) scale(${Math.min(1.04, 1/sc*.2 + .9)})` }, { opacity:1, transform:'none' }], { duration:360, delay:120, easing:EASE, fill:'backwards' });
  /* the artwork travels between them */
  const fly = document.createElement('div'); fly.className = 'fly'; fly.innerHTML = coverOf(S[st.si]);
  const r0 = getComputedStyle(srcArt).borderRadius, r1 = getComputedStyle(dstArt).borderRadius;
  const rad = (r, R) => r.includes('%') ? `${R.width/2}px` : `${parseFloat(r)*K}px`;
  Object.assign(fly.style, { left:`${dR.left}px`, top:`${dR.top}px`, width:`${dR.width}px`, height:`${dR.height}px` });
  document.body.appendChild(fly);
  srcArt.style.visibility = 'hidden'; dstArt.style.visibility = 'hidden';
  const sx = sR.width/dR.width;
  fly.animate([
    { transform:`translate(${sR.left-dR.left}px,${sR.top-dR.top}px) scale(${sx})`, borderRadius:`${parseFloat(rad(r0,sR))/sx}px` },
    { transform:'none', borderRadius:rad(r1,dR) } ], { duration:460, easing:EASE })
    .onfinish = () => { fly.remove(); srcArt.style.visibility = ''; dstArt.style.visibility = ''; };
}

/* ---------- playback ---------- */
const audio = $('#audio');
const isReal = () => st.real && S[st.si].id === 'you';
function ensureGraph(){
  if (SIG.analyser) return;
  try { const Ctx = window.AudioContext || window.webkitAudioContext; SIG.ctx = new Ctx();
    const src = SIG.ctx.createMediaElementSource(audio), an = SIG.ctx.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = .72;
    src.connect(an); an.connect(SIG.ctx.destination); SIG.analyser = an; SIG.td = new Uint8Array(an.fftSize); SIG.fd = new Uint8Array(an.frequencyBinCount);
  } catch(e) {}
}
function toggle(){
  st.playing = !st.playing;
  if (isReal()){ if (st.playing){ ensureGraph(); SIG.ctx && SIG.ctx.resume(); audio.playbackRate = st.speed; audio.play().catch(() => { st.playing = false; renderNow(); }); } else audio.pause(); }
  settle = 120; renderNow();
}
function seek(t){ const ep = cur(); ep.pos = Math.max(0, Math.min(ep.dur, t)); if (isReal()) audio.currentTime = ep.pos; renderTime(); settle = 40; }
function play(si, ei){
  if (isReal()) audio.pause();
  st.si = si; st.ei = ei; const ep = cur(); if (ep.pos >= ep.dur) ep.pos = 0;
  if (isReal()){ audio.src = st.real; audio.currentTime = ep.pos; }
  st.playing = false; toggle(); renderList();
}

let last = performance.now(), settle = 60;
function frame(now){
  const el = Math.max(8, Math.min(64, now - last)); last = now;
  const ep = cur();
  if (st.playing){ if (isReal()) ep.pos = audio.currentTime || ep.pos; else ep.pos += el/1000*st.speed;
    if (ep.pos >= ep.dur){ ep.pos = ep.dur; st.playing = false; renderNow(); renderList(); }
    if (Math.floor(now/250) !== Math.floor((now-el)/250)) renderTime(); }
  const pk = peaksFor(ep);
  updateSignal(el, st.playing && !reduced.matches, pk[Math.min(pk.length-1, Math.floor(ep.pos/ep.dur*pk.length))] || 0);
  if (st.playing || settle > 0){ drawAll(el); if (!st.playing) settle--; }
  requestAnimationFrame(frame);
}

/* ---------- a file of yours ---------- */
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext, ctx = new Ctx(), ab = await ctx.decodeAudioData(await f.arrayBuffer());
    const ch = ab.getChannelData(0), N = 360, bin = Math.floor(ch.length/N), raw = [];
    for (let i=0;i<N;i++){ let m = 0; for (let j=i*bin;j<(i+1)*bin;j+=8) m = Math.max(m, Math.abs(ch[j])); raw.push(m); }
    const hi = Math.max(...raw) || 1; ctx.close && ctx.close();
    if (st.real) URL.revokeObjectURL(st.real); st.real = URL.createObjectURL(f);
    let yi = S.findIndex(s => s.id === 'you');
    if (yi < 0){ S.push({ id:'you', name:'Your files', short:'Your file', cast:'#8fa4c9', freq:'On this device', about:'Audio you brought from this device. It never leaves it.', eps:[] }); yi = S.length-1; }
    const ep = { title: f.name.replace(/\.[^.]+$/, ''), dur: ab.duration, pos: 0, d: TODAY, peaks: raw.map(v => Math.max(.04, v/hi)), si: yi, ei: 0 };
    S[yi].eps.forEach(x => x.ei++); S[yi].eps.unshift(ep);
    play(yi, 0);
  } catch(err) { $('#nowShow').textContent = 'That file could not be read here'; }
});

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]'); if (m){ setMode(m.dataset.mode); return; }
  const a = e.target.closest('[data-act]');
  if (a){ const k = a.dataset.act;
    if (k === 'toggle') toggle();
    if (k === 'back') seek(cur().pos - 15);
    if (k === 'fwd') seek(cur().pos + 30);
    if (k === 'speed'){ const sp = [1,1.2,1.4,1.6,2]; st.speed = sp[(sp.indexOf(st.speed)+1) % sp.length]; if (isReal()) audio.playbackRate = st.speed; renderNow(); }
    if (k === 'panel'){ st.panel = !st.panel; $('#panel').dataset.open = st.panel; settle = 60; }
    return; }
  const v = e.target.closest('[data-vz]'); if (v){ st.vz = v.dataset.vz; $('#stage').dataset.mode = st.vz; document.querySelectorAll('[data-vz]').forEach(b => b.setAttribute('aria-pressed', b === v)); settle = 120; return; }
  const t = e.target.closest('[data-tab]'); if (t){ st.tab = t.dataset.tab; st.open = null; renderList(); return; }
  const o = e.target.closest('[data-open]'); if (o){ st.open = o.dataset.open === 'back' ? null : +o.dataset.open; renderList(); $('#list').scrollTop = 0; return; }
  const p = e.target.closest('[data-play]'); if (p){ const [si, ei] = p.dataset.play.split(':').map(Number); play(si, ei); return; }
  const lk = e.target.closest('[data-look]'); if (lk){ setLook(lk.dataset.look); if (st.tab === 'settings') requestAnimationFrame(renderList); return; }
  const ac = e.target.closest('[data-accent]'); if (ac){ setAccent(ac.dataset.accent); renderList(); return; }
  const li = e.target.closest('[data-light]'); if (li){ root.dataset.light = li.dataset.light; try { localStorage.setItem('listener.light', li.dataset.light); } catch(err) {} renderList(); return; }
});
function seekFromOrbit(e, cv){ const r = cv.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let a = Math.atan2(e.clientY-cy, e.clientX-cx) + Math.PI/2; if (a < 0) a += Math.PI*2; seek(a/(Math.PI*2)*cur().dur); }
$('#cMain').addEventListener('pointerdown', e => {
  const cv = e.currentTarget, r = cv.getBoundingClientRect();
  if (st.vz === 'orbit') seekFromOrbit(e, cv); else seek((e.clientX - r.left)/r.width*cur().dur);
});
$('#cMini').addEventListener('pointerdown', e => seekFromOrbit(e, e.currentTarget));
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space'){ e.preventDefault(); toggle(); }
  if (e.key === 'ArrowLeft') seek(cur().pos - 15);
  if (e.key === 'ArrowRight') seek(cur().pos + 30);
  if (e.key === 'Escape' && st.panel){ st.panel = false; $('#panel').dataset.open = false; }
});

function setLook(v){ if (v) root.dataset.look = v; else delete root.dataset.look;
  document.querySelectorAll('[data-look]').forEach(b => b.setAttribute('aria-pressed', b.dataset.look === v));
  try { localStorage.setItem('listener.look', v); } catch(e) {}
  requestAnimationFrame(() => { resolveColors(); settle = 40; }); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { resolveColors(); settle = 40; });
new MutationObserver(() => { resolveColors(); settle = 40; }).observe(root, { attributes:true, attributeFilter:['data-theme'] });

/* scale the 1180 × 780 desktop to the page, like the app on a smaller screen */
function scaleDesk(){ const w = $('#desk').clientWidth; K = Math.min(1, w/1180); $('#deskInner').style.transform = `scale(${K})`; $('#desk').style.height = `${780*K}px`; placeLight(); settle = 20; }
new ResizeObserver(scaleDesk).observe($('#desk'));

let saved = ''; try { saved = localStorage.getItem('listener.look') || ''; } catch(e) {}
let savedLight = 'cast', savedAccent = 'Blue'; try { savedLight = localStorage.getItem('listener.light') || 'cast'; savedAccent = localStorage.getItem('listener.accent') || 'Blue'; } catch(e) {}
root.dataset.light = savedLight; setAccent(savedAccent);
setLook(saved); resolveColors(); renderNow(); renderList(); scaleDesk();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeLight(); settle = 20; });
requestAnimationFrame(frame);
})();
</script>
</body></html>
