[package]
name = "listener"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "listener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rss = "2.1.2"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
roxmltree = "0.21.1"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "http2", "charset", "system-proxy"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "pcm", "wav", "alac"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding for loudness peaks is far too slow unoptimised; keep debug builds usable.
[profile.dev.package."symphonia-bundle-mp3"]
opt-level = 3
[profile.dev.package."symphonia-codec-aac"]
opt-level = 3
[profile.dev.package."symphonia-format-isomp4"]
opt-level = 3
[profile.dev.package."symphonia-core"]
opt-level = 3
