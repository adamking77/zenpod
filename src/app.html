<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zenpod</title>
    <script>
      // The core sets each window's theme before it shows, so this is right on first paint.
      document.documentElement.dataset.flavor = matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'flat';
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
